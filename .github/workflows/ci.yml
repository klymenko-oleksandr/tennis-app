name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis
          POSTGRES_DB: tennis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tennis:tennis@localhost:5432/tennis_test?schema=public
      DATABASE_URL_TEST: postgresql://tennis:tennis@localhost:5432/tennis_test?schema=public
      # Not real secrets — the API only needs *some* value to boot; these
      # tests never talk to GoTrue (see bookings.service.integration.spec.ts).
      GOTRUE_JWT_SECRET: ci-only-not-a-real-secret
      GOTRUE_URL: http://localhost:9999

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx nx run-many -t lint test build -p api web
